plugins {
    id 'java'
    id 'war'
}

group = 'com.gagechaeum'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.9.2'
    springVersion = '5.3.37'
    lombokVersion = '1.18.30'
    springSecurityVersion = '5.7.3'
    jjwtVersion = '0.11.5'
    log4j2Version = '2.23.1'
}

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.incremental = true
    options.fork = true
    options.forkOptions.jvmArgs += ['-Xmx3g', '-XX:+UseG1GC']
    options.compilerArgs += ['-Xlint:none', '-nowarn']
}

configurations {
    swaggerUI
}

dependencies {
    // Spring
    implementation ("org.springframework:spring-context:${springVersion}") {
        exclude group: 'commons-logging', module: 'commons-logging'
    }

    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation 'javax.inject:javax.inject:1'

    // Pageable, Sort, PageRequest 지원
    implementation "org.springframework.data:spring-data-commons:2.7.18"

    // JavaMailSender 지원 (메일 기능)
    implementation "org.springframework:spring-context-support:${springVersion}"

    // Javax Mail & Activation (Spring 5.x는 javax.* 라인 사용)
    implementation 'com.sun.mail:javax.mail:1.6.2'
    implementation 'com.sun.activation:javax.activation:1.2.0'

    // AOP
    runtimeOnly 'org.aspectj:aspectjrt:1.9.20'
    runtimeOnly 'org.aspectj:aspectjweaver:1.9.20'

    // JSP, SERVLET, JSTL
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'
//    compileOnly 'javax.servlet.jsp:jsp-api:2.1'
    implementation 'javax.servlet:jstl:1.2'

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Jackson - Json 처리
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.5'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.13.5'

    // DB
    implementation 'com.mysql:mysql-connector-j:8.1.0'
    implementation 'com.zaxxer:HikariCP:2.7.4'
    implementation "org.springframework:spring-tx:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"

    // MyBatis
    implementation 'org.mybatis:mybatis:3.4.6'
    implementation 'org.mybatis:mybatis-spring:1.3.2'

    // Logging
    implementation "org.apache.logging.log4j:log4j-api:${log4j2Version}"
    implementation "org.apache.logging.log4j:log4j-core:${log4j2Version}"
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:${log4j2Version}"
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'

    //
    // Redis
//    implementation 'org.springframework.data:spring-data-redis:2.7.6'
//    implementation 'redis.clients:jedis:3.8.0'

    // Test
    testImplementation "org.springframework:spring-test:${springVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'

    // Spring Security
    implementation "org.springframework.security:spring-security-core:${springSecurityVersion}"
    implementation "org.springframework.security:spring-security-web:${springSecurityVersion}"
    implementation "org.springframework.security:spring-security-config:${springSecurityVersion}"
    implementation "org.springframework.security:spring-security-crypto:${springSecurityVersion}"

    // Validation
    implementation 'org.hibernate.validator:hibernate-validator:6.2.0.Final'
    implementation 'javax.validation:validation-api:2.0.1.Final'

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Batch
    implementation "org.springframework.batch:spring-batch-core:4.3.10"
    implementation "org.springframework.batch:spring-batch-infrastructure:4.3.10"

    // HTTP
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'

    // Swagger
    implementation 'io.springfox:springfox-swagger2:2.9.2'
    implementation 'io.springfox:springfox-swagger-ui:2.9.2'

    // Swagger UI WebJar 리소스를 수동으로 추가
    add("swaggerUI", "org.webjars:swagger-ui:3.52.5")

    // Redis
    implementation 'org.springframework.data:spring-data-redis:2.7.18'
    implementation 'io.lettuce:lettuce-core:6.1.10.RELEASE'
    
    // AWS S3
    implementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE'

    // OAuth2
    implementation 'org.springframework.security:spring-security-oauth2-client:5.7.3'
    implementation 'org.springframework.security:spring-security-oauth2-jose:5.7.3'

    // WebSocket
    implementation "org.springframework:spring-websocket:${springVersion}"
    implementation "org.springframework:spring-messaging:${springVersion}"
    implementation "org.springframework:spring-webmvc:${springVersion}"

    // 기타
    implementation 'xerces:xercesImpl:2.12.2'
    implementation 'com.opencsv:opencsv:5.7.1'
    implementation 'commons-fileupload:commons-fileupload:1.4'
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
}

test {
    useJUnitPlatform()
}
